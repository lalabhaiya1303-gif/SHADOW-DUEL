/* =========================================================================
   14. RENDERING — battle (HUD + overlays)
   ========================================================================= */
function drawHealthBar(x, y, w, h, f, flip) {
  const r = f.hp / f.maxHp, tr = f.trailHp / f.maxHp;
  const fill = ratio => { if (flip) ctx.fillRect(w - w * ratio, 0, w * ratio, h); else ctx.fillRect(0, 0, w * ratio, h); };
  ctx.save();
  ctx.translate(x, y);
  ctx.transform(1, 0, flip ? 0.5 : -0.5, 1, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(-6, -6, w + 12, h + 12);
  ctx.fillStyle = '#2a0b0e';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#e3201c';
  fill(tr);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  const low = r < 0.25 && Math.floor(performance.now() / 200) % 2;
  g.addColorStop(0, low ? '#ffd6a0' : '#fff07a');
  g.addColorStop(1, low ? '#ff7a30' : '#e59a17');
  ctx.fillStyle = g;
  fill(r);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(0, 2, w, h * 0.3);
  ctx.strokeStyle = '#d8b06a'; ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, w, h);
  ctx.restore();
}

function drawEnergyBar(x, y, w, h, f, flip) {
  const r = f.energy / MAX_EN, full = f.energy >= MAX_EN;
  ctx.save();
  ctx.translate(x, y);
  ctx.transform(1, 0, flip ? 0.5 : -0.5, 1, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(-4, -4, w + 8, h + 8);
  ctx.fillStyle = '#140a26';
  ctx.fillRect(0, 0, w, h);
  const g = ctx.createLinearGradient(flip ? w : 0, 0, flip ? 0 : w, 0);
  g.addColorStop(0, '#2a2f6a'); g.addColorStop(1, auraColor(f));      // energy bar follows the aura color
  ctx.fillStyle = g;
  if (full) { ctx.shadowColor = '#c084ff'; ctx.shadowBlur = 10 + 8 * Math.sin(performance.now() / 120); }
  if (flip) ctx.fillRect(w - w * r, 0, w * r, h); else ctx.fillRect(0, 0, w * r, h);
  ctx.shadowBlur = 0;
  if (full) { ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.2 * Math.sin(performance.now() / 100)})`; ctx.fillRect(0, 0, w, h); }
  ctx.strokeStyle = '#8a6cc8'; ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, w, h);
  ctx.restore();
}

function drawFighterHUD(f, flip, wins) {
  const w = 470, x = flip ? W - 80 - w : 80;
  drawHealthBar(x, 30, w, 26, f, flip);
  const ew = 320, ex = flip ? W - 80 - ew - 16 : 80 - 16;
  drawEnergyBar(ex, 66, ew, 10, f, flip);

  ctx.save();
  ctx.font = `26px ${FONT}`;
  ctx.textBaseline = 'top';
  ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round';
  ctx.textAlign = flip ? 'right' : 'left';
  const tx = flip ? W - 80 - 24 : 80 - 24;
  ctx.strokeText(f.name, tx, 86);
  ctx.fillStyle = '#f4e6c8';
  ctx.fillText(f.name, tx, 86);
  if (f.energy >= MAX_EN) {
    ctx.font = `16px ${FONT}`;
    const label = f.isPlayer ? 'SHADOW STRIKE READY  [U]' : 'SHADOW STRIKE READY';
    const lx = flip ? ex - 14 : ex + ew + 10;
    ctx.strokeText(label, lx, 63);
    ctx.fillStyle = '#d6a6ff';
    ctx.fillText(label, lx, 63);
  }
  // round win markers
  for (let i = 0; i < 2; i++) {
    const cx = flip ? W - 80 - w + 30 + i * 28 : 80 + w - 30 - i * 28;
    ctx.beginPath(); ctx.arc(cx, 98, 9, 0, Math.PI * 2);
    ctx.fillStyle = i < wins ? '#ffd24a' : 'rgba(0,0,0,0.6)';
    if (i < wins) { ctx.shadowColor = '#ffb020'; ctx.shadowBlur = 12; }
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#d8b06a'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
}

function drawHUD() {
  drawFighterHUD(player, false, game.wins[0]);
  drawFighterHUD(enemy, true, game.wins[1]);
  ctx.save();
  ctx.fillStyle = '#120508';
  ctx.strokeStyle = '#d8b06a'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3;
    ctx.lineTo(W / 2 + Math.cos(a) * 44, 48 + Math.sin(a) * 44);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  text(String(Math.ceil(game.timer)), W / 2, 50, 40, game.timer <= 10 ? '#ff5a3c' : '#f4e6c8');
  text('ROUND ' + game.round + '  ·  STAGE ' + (story.stage + 1) + '/' + OPPONENTS.length, W / 2, 106, 14, '#d8b06a');
  ctx.restore();
}

function drawBattleOverlay() {
  const t = game.t;
  if (game.state === 'intro') {
    if (t < 0.9) bigText(game.roundLabel, W / 2, H / 2 - 60, 96, '#f4e6c8', 1 + Math.max(0, 0.25 - t) * 2);
    else bigText('FIGHT!', W / 2, H / 2 - 60, 140, '#ff4b2b', 1 + Math.max(0, 1.15 - t) * 2, Math.min(1, (1.8 - t) * 4));
  }
  const res = game.result;
  const resCol = (res === 'YOU WIN' || res === 'ROUND TO YOU') ? '#ffe9a8' : res === 'DRAW' ? '#f4e6c8' : '#ff5a3c';
  const bannerGrad = (y0, y1) => {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, '#ffd27a'); g.addColorStop(1, '#d4161c');
    return g;
  };
  if (game.state === 'ko') {
    const sc = 1 + Math.max(0, 0.3 - t) * 4;
    bigText(game.banner, W / 2, H / 2 - 100, game.banner === 'K.O.' ? 170 : 120, bannerGrad(H / 2 - 160, H / 2), sc);
    if (t > 1.3) bigText(res, W / 2, H / 2 + 40, game.matchOver ? 84 : 60, resCol, 1 + Math.max(0, 1.5 - t) * 3, 1, FONT);
  }
  if (game.state === 'end' && playerWonMatch()) {
    // compact header + BATTLE ANALYSIS panel
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);
    bigText(game.banner, W / 2, 88, 80, bannerGrad(50, 125));
    bigText(res, W / 2, 162, 56, resCol, 1 + Math.max(0, 0.2 - t) * 3, 1, FONT);
    if (game.analysis) drawAnalysis(game.analysis, 250, 200, 780, 395, t);
    if (t > 0.6) bigText('Press ENTER to continue', W / 2, 648, 28, '#f4e6c8', 1, 0.6 + 0.4 * Math.sin(t * 5), FONT);
  }
  if (game.state === 'end' && !playerWonMatch()) {
    // DEFEAT: slow fade with a story line, then analysis + TRY AGAIN / MAIN MENU
    ctx.fillStyle = `rgba(0,0,0,${Math.min(0.86, t / 1.6 * 0.86)})`;
    ctx.fillRect(0, 0, W, H);
    const k = clamp((t - 2.3) / 0.6, 0, 1), e = k * k * (3 - 2 * k);
    bigText("You couldn't protect them this time.", W / 2, (H / 2 - 20) + (105 - (H / 2 - 20)) * e, 52 - 14 * e,
      '#ecdccc', 1, clamp((t - 0.4) / 1.2, 0, 1));
    if (t > 2.8) {
      if (game.analysis) drawAnalysis(game.analysis, 250, 160, 780, 395, t - 2.8);
      drawMenuButtons(menus.lose, W / 2, 620, 310, 260, 50, true);
    }
  }
  if (game.state === 'outro') {
    // the beaten opponent's last words
    ctx.fillStyle = `rgba(0,0,0,${Math.min(0.55, t * 1.2)})`;
    ctx.fillRect(0, 0, W, H);
    const opp = currentOpp();
    if (t > 0.3) drawSpeech(opp.name, opp.defeat, W / 2, 470, 760, 'opp', (t - 0.4) * 32, null);
    text('ENTER / CLICK  continue', W / 2, H - 20, 17, 'rgba(244,230,200,0.6)');
  }
  if (game.state === 'intro' || game.state === 'fight') {
    text('P / Esc  pause   ·   I  AI vision', 22, H - 18, 15, 'rgba(244,230,200,0.5)', 'left');
  }
}

function wrapText(str, x, y, maxW, lh, size, color, font = FONT) {
  ctx.font = `${size}px ${font}`;
  let line = '';
  for (const w of str.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { text(line, x, y, size, color, 'left', font); y += lh; line = w; }
    else line = test;
  }
  if (line) text(line, x, y, size, color, 'left', font);
  return y;
}

function drawAnalysis(an, x, y, w, h, t) {
  const a = Math.min(1, t * 3);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(10,4,20,0.86)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#8a6cc8'; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  ctx.shadowColor = '#b14cff'; ctx.shadowBlur = 12;
  text('BATTLE ANALYSIS', x + 24, y + 32, 30, '#e9d5ff', 'left', BRUSH);
  ctx.shadowBlur = 0;
  // how predictable was the player?
  if (an.predTotal >= 5) {
    text('AI READ YOUR NEXT MOVE', x + w - 24, y + 22, 13, '#b9a3e0', 'right');
    const bw = 200, bx = x + w - 24 - bw;
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(bx, y + 34, bw, 10);
    ctx.fillStyle = an.readRate >= 0.5 ? '#ff6a5a' : '#6fe0a0'; ctx.fillRect(bx, y + 34, bw * an.readRate, 10);
    text(pct(an.readRate), bx - 8, y + 40, 16, '#ffffff', 'right');
  }
  text('FIGHTING STYLE', x + 24, y + 74, 14, '#b9a3e0', 'left');
  text(an.label, x + 24, y + 106, 38, '#ffffff', 'left', BRUSH);
  text('TOP TENDENCIES', x + 24, y + 150, 14, '#b9a3e0', 'left');
  an.tendencies.forEach((s, i) => text('▸  ' + s, x + 34, y + 180 + i * 30, 20, '#f4e6c8', 'left'));
  if (!an.tendencies.length) text('Not enough data: try more moves next time', x + 34, y + 180, 20, '#f4e6c8', 'left');
  text('TIP', x + 24, y + 282, 14, '#b9a3e0', 'left');
  wrapText(an.tip, x + 24, y + 310, w - 48, 26, 21, '#d6a6ff');
  text(`Player profile saved  ·  ${model.life.fights} fight${model.life.fights === 1 ? '' : 's'} analysed`, x + w - 16, y + h - 14, 13, 'rgba(200,190,230,0.6)', 'right');
  ctx.restore();
}

// Glowing "AI has learned..." message near the top
function drawAiMsg() {
  if (!aiMsg) return;

// "AI VISION" debug overlay (toggle with I)
function drawVision() {
  const x = W - 352, y = 128, w = 332, h = 412, L = ai.learn, fs = fightStats, thr = ai.threshold;
  ctx.save();
  ctx.fillStyle = 'rgba(4,6,20,0.74)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(120,220,255,0.6)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y, w, h);
  ctx.shadowColor = '#4fd8ff'; ctx.shadowBlur = 10;
  text('AI VISION', x + 14, y + 18, 20, '#8ff0ff', 'left');
  ctx.shadowBlur = 0;
  text('[I] hide', x + w - 12, y + 18, 12, 'rgba(200,230,255,0.6)', 'right');
  text(enemy.name + (L > 0 ? `  ·  learning rate ${pct(L)}` : '  ·  BASELINE (does not adapt)'), x + 14, y + 40, 13, L > 0 ? '#d6a6ff' : '#b0b0b0', 'left');

  text('PLAYER ACTIONS (this fight)', x + 14, y + 62, 12, '#9fb2ff', 'left');
  const n = Math.max(1, fs.actions), top = fs.actions ? argmax(fs.counts) : null;
  ACTIONS.forEach((a, i) => {
    const yy = y + 80 + i * 18, v = fs.counts[a] / n;
    text(a === 'special' ? 'SPECIAL' : LABEL[a], x + 14, yy, 12, '#e8e0ff', 'left');
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x + 90, yy - 6, 180, 11);
    ctx.fillStyle = a === top ? '#ff8a5a' : '#6fb6ff'; ctx.fillRect(x + 90, yy - 6, 180 * v, 11);
    text(pct(v), x + w - 14, yy, 12, '#e8e0ff', 'right');
  });
  let yy = y + 196;
  text('LAST MOVES:  ' + (model.history.slice(-6).join(' ') || '-'), x + 14, yy, 13, '#e8e0ff', 'left');
  text('P K J B C S', x + w - 14, yy, 10, 'rgba(200,210,255,0.45)', 'right');

  yy += 24;
  text('PREDICTED NEXT MOVE (n-gram)', x + 14, yy, 12, '#9fb2ff', 'left');
  yy += 20;
  const pr = ai.pred;
  if (pr) {
    const hot = pr.conf >= thr && pr.n >= PRED_MIN_N;
    text(LABEL[CODE_ACT[pr.code]], x + 14, yy, 19, '#ffffff', 'left');
    text(pct(pr.conf), x + w - 14, yy, 19, hot ? '#ff6a5a' : '#ffffff', 'right');
    yy += 16;
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x + 14, yy - 4, w - 28, 8);
    ctx.fillStyle = hot ? '#ff5a4a' : '#8ff0ff'; ctx.fillRect(x + 14, yy - 4, (w - 28) * Math.min(1, pr.conf), 8);
    ctx.fillStyle = '#ffd27a'; ctx.fillRect(x + 14 + (w - 28) * thr - 1, yy - 8, 2, 16);
    yy += 17;
    const status = L <= 0 ? 'prediction NOT used: this opponent does not adapt'
      : hot ? '⚠ COUNTER ARMED' : `below ${pct(thr)} threshold: not countering`;
    text(status, x + 14, yy, 12, L <= 0 ? '#b0b0b0' : hot ? '#ff7a6a' : '#a0e8c0', 'left');
    yy += 15;
    text(`order-${pr.order} context  ·  ${Math.round(pr.n)} samples`, x + 14, yy, 11, 'rgba(200,210,255,0.6)', 'left');
  } else {
    text('gathering data...', x + 14, yy, 15, '#b0b0b0', 'left');
    yy += 48;

function renderBattle() {
  const opp = currentOpp(), st = opp.bg, im = stageImg(opp);
  const z = cam.z;
  // background with half-strength parallax zoom (+ slow ambient drift on image backgrounds)
  let bz = 1 + (z - 1) * 0.5;
  if (im) bz += 0.03 + 0.012 * Math.sin(envT * 0.13);
  const bhalf = W / (2 * bz);
  const drift = im ? Math.sin(envT * 0.09) * 10 : 0;
  const bcx = clamp(W / 2 + (cam.x - W / 2) * 0.5 + drift, bhalf, W - bhalf);
  const sx = bcx - bhalf, sy = GROUND - GROUND / bz;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(im ? im.cv : bgCanvases[st], sx * scale, sy * scale, (W / bz) * scale, (H / bz) * scale, 0, 0, canvas.width, canvas.height);
  if (im) {                                   // torch light, fog, embers, petals — in image space
    ctx.setTransform(scale * bz, 0, 0, scale * bz, -sx * scale * bz, -sy * scale * bz);
    drawEnvFx(opp, im);
  }

  if (game.superT > 0) {   // screen darken for Shadow Strike activation
    ctx.fillStyle = `rgba(6,0,16,${0.62 * Math.min(1, game.superT / 0.25)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  const shk = paused ? 0 : game.shake;
  const shx = shk ? (Math.random() - 0.5) * shk * 2 : 0;
  const shy = shk ? (Math.random() - 0.5) * shk * 2 : 0;
  ctx.setTransform(scale * z, 0, 0, scale * z, (W / 2 - cam.x * z + shx) * scale, (GROUND - GROUND * z + shy) * scale);
  if (!im) drawEmbers(st);
  else {                                      // soft warm glow behind the fighters so they pop
    const mx = (player.x + enemy.x) / 2;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(mx, GROUND - 90, 20, mx, GROUND - 90, 360);
    g.addColorStop(0, 'rgba(255,170,100,0.2)'); g.addColorStop(1, 'rgba(255,120,60,0)');
    ctx.fillStyle = g; ctx.fillRect(mx - 360, GROUND - 450, 720, 640);
    ctx.restore();
  }
  drawShadow(enemy); drawShadow(player);
  drawGhosts(enemy); drawGhosts(player);
  // draw the attacker on top so the striking limb is visible
  if (enemy.attack && !player.attack) { drawFighter(player); drawFighter(enemy); }
  else { drawFighter(enemy); drawFighter(player); }
  drawParticles();
  drawPopups();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const post = game.state === 'end' || game.state === 'outro';
  if (!post) drawHUD();
  if (save.vision && !post) drawVision();
  if (game.state === 'fight' || game.state === 'ko') drawAiMsg();
  drawBattleOverlay();

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    bigText('PAUSED', W / 2, 220, 96, '#f4e6c8');
    drawMenuButtons(menus.pause, W / 2, 350, 76);
  }
}

function customKey(c) {
  if (c === 'Escape') { backCustomize(); return; }
  if (c === 'KeyW' || c === 'ArrowUp') { cust.row = Math.max(0, cust.row - 1); Sound.blip(); }
  else if (c === 'KeyS' || c === 'ArrowDown') { cust.row = Math.min(4, cust.row + 1); Sound.blip(); }
  else if (c === 'KeyA' || c === 'ArrowLeft' || c === 'KeyD' || c === 'ArrowRight') {
    const d = (c === 'KeyA' || c === 'ArrowLeft') ? -1 : 1;
    if (cust.row === 4) { custMenu.sel = (custMenu.sel + 2 + d) % 2; Sound.blip(); }
    else setCustom(cust.row, (save.custom[CUST_ROWS[cust.row][0]] + 5 + d) % 5);
  } else if (isConfirm(c)) {
    if (cust.row === 4) activate(custMenu); else { cust.row++; Sound.blip(); }
  }
}
function customClick(p) {
  for (const r of cust.rects) if (inRect(r, p)) { cust.row = r.row; setCustom(r.row, r.col); return true; }
  const i = custMenu.items.findIndex(it => inRect(it.rect, p));
  if (i >= 0) { cust.row = 4; custMenu.sel = i; activate(custMenu); return true; }
  return false;
}

function drawSpeech(name, line, cx, y, w, who, chars, tailX) {
  const h = 104, x = cx - w / 2, col = who === 'veer' ? '#f4e6c8' : '#ff6a4a';
  ctx.save();
  ctx.fillStyle = 'rgba(6,2,6,0.85)';
  ctx.fillRect(x, y, w, h);
  if (tailX != null) {
    ctx.beginPath(); ctx.moveTo(tailX - 14, y + h); ctx.lineTo(tailX + 14, y + h); ctx.lineTo(tailX, y + h + 22); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  text(name, x + 16, y + 18, 22, col, 'left', BRUSH);
  const done = drawTyped(line, chars, x + 18, y + 52, w - 36, 28, 'italic 23px Georgia, serif', '#f4ece0', 'left');
  if (done) text('▶', x + w - 18, y + h - 16, 16, `rgba(255,240,220,${0.5 + 0.5 * Math.sin(performance.now() / 180)})`, 'right');
  ctx.restore();
  return done;
}

function renderCutscene() {
  if (!cs || cs.done) return;
  const p = cs.panels[cs.i], t = cs.t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // camera drift (eased over the panel)
  const c = p.cam || [0, 0, 1, 1, W / 2, H / 2];
  const k = Math.min(1, t / (p.steps ? (p.camDur || 12) : cs.dur)), e = k * k * (3 - 2 * k);
  let dx = c[0] + (c[1] - c[0]) * e, fx = c[4];
  const z = c[2] + (c[3] - c[2]) * e, fy = c[5];
  if (p.follow && cs.camX != null) { fx = W / 2; dx = W / 2 - cs.camX; }   // camera follows an actor
  if (p.filter) ctx.filter = p.filter;
  // background layer: slower parallax (intro image if present, else canvas scene)
  const im = introImg(p.img);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const bz = 1.04 + (z - 1) * 0.4;
  ctx.translate(fx, fy); ctx.scale(bz, bz); ctx.translate(-fx + dx * 0.3, -fy);
  ctx.drawImage(im ? im.cv : bgCanvases[p.bg], 0, 0, W, H);
  // world layer
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (p.tint) { ctx.fillStyle = p.tint; ctx.fillRect(0, 0, W, H); }
  ctx.translate(fx, fy); ctx.scale(z, z); ctx.translate(-fx + dx, -fy);
  if (p.scenery && !im) p.scenery.call(p, cs.actors, t);   // procedural scenery only without an image
  if (p.draw) p.draw.call(p, cs.actors, t);
  drawCsFx();
  ctx.filter = 'none';
  // screen-space overlays
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (p.dim) { ctx.fillStyle = `rgba(0,0,0,${p.dim})`; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (p.overlay) p.overlay(t);
  // cinematic letterbox
  const bar = Math.min(1, sceneT * 2);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, 62 * bar);
  ctx.fillRect(0, H - 118 * bar, W, 118 * bar);
  if (p.text) drawTyped(p.text, (t - 0.5) * (p.cps || 28), W / 2, H - 60, 1180, 34, 'italic 29px Georgia, serif', '#f2e6d8');
  const L = cs.line;
  if (L) {
    const chars = L.t * L.cps;
    if (!L.who) drawTyped(L.text, chars, W / 2, H - 60, 1180, 34, 'italic 29px Georgia, serif', '#f2e6d8');   // narration
    else {                                             // dialogue box with the speaker's name
      const col = L.who === 'VEER' ? '#f4e6c8' : '#ffb0c0';
      ctx.save();
      ctx.fillStyle = 'rgba(10,4,8,0.9)'; ctx.fillRect(150, H - 112, W - 300, 100);
      ctx.strokeStyle = col; ctx.globalAlpha = 0.7; ctx.lineWidth = 1.5; ctx.strokeRect(150, H - 112, W - 300, 100);
      ctx.restore();
      text(L.who, 176, H - 92, 22, col, 'left', BRUSH);
      const done = L.shout
        ? drawTyped(L.text, chars, W / 2, H - 52, 900, 44, '46px ' + BRUSH, '#ffe0d0')
        : drawTyped(L.text, chars, W / 2, H - 52, 920, 30, 'italic 26px Georgia, serif', '#f4ece0');
      if (done) text('▶', W - 172, H - 28, 15, `rgba(255,240,220,${0.5 + 0.5 * Math.sin(performance.now() / 180)})`, 'right');
    }
  }
  // fades between panels
  const fadeIn = Math.min(1, t / 0.7);
  const fadeOut = cs.out !== null ? Math.max(0, cs.out / cs.outMax) : 1;
  const alpha = fadeIn * fadeOut;
  if (alpha < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - alpha})`; ctx.fillRect(0, 0, W, H); }
  text('ESC  skip    ·    ENTER / SPACE / CLICK  advance', W - 20, 32, 14, 'rgba(255,255,255,0.45)', 'right');
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (scene === 'battle') renderBattle();
  else if (scene === 'cutscene') renderCutscene();
  else if (scene === 'custom') renderCustomize();
  else if (scene === 'menu') renderMenu();
  else if (scene === 'controls') renderControls();
  else if (scene === 'vs') renderVS();
  else if (scene === 'victory') renderVictory();
  drawMuteIcon();
}

/* =========================================================================
   16. MAIN LOOP
   ========================================================================= */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  let n = 0;
  if (scene === 'battle') {
    if (!paused) {
      story.time += dt;
      updateEnv(dt * game.timeScale, currentOpp());
      realUpdate(dt);
      acc += dt * game.timeScale;
      while (acc >= STEP && n++ < 5) { step(); acc -= STEP; }
    }
  } else {
    sceneT += dt;
    acc += dt;
    while (acc >= STEP && n++ < 5) { sceneStep(); acc -= STEP; }
    if (scene === 'cutscene') updateCutscene(dt);
    if (scene === 'vs') { updateEnv(dt, currentOpp()); if (sceneT > 0.8) vsDlg.t += dt; }
  }
  if (n >= 5) acc = 0;
  render();
  requestAnimationFrame(frame);
}

if (document.fonts && document.fonts.load) document.fonts.load('40px "Permanent Marker"').catch(() => {});
initEmbers();
goMenu();
resize();
requestAnimationFrame(frame);
</script>
</body>
