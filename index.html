const SAVE_KEY = 'shadowDuel.save';
function loadSave() {
  const def = { best: -1, muted: false, vision: false, profile: null, storySeen: false, custom: null };
  let s;
  try { s = Object.assign(def, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); }
  catch (e) { s = def; }
  s.custom = Object.assign({ band: 0, head: 0, outfit: 0, aura: 0 }, s.custom || {});   // Veer customization
  return s;
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage blocked */ } }
const save = loadSave();   // best: highest opponent index reached (3 = beat the game)

/* =========================================================================
   4. SOUND  (Web Audio only, everything synthesized)
   ========================================================================= */
const STORY_MELODY = [                    // slow, sad flute for cutscenes
  [0, 'A4', 6], [6, 'G4', 2], [8, 'E4', 6], [14, 'D4', 2], [16, 'C5', 5], [21, 'A4', 3], [24, 'G4', 4], [28, 'E4', 4],
];
const NOTE = { C4: 261.63, D4: 293.66, E4: 329.63, G4: 392, A4: 440, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880 };
const MUSIC_STEP = 60 / 84 / 2;          // eighth notes at 84 BPM
const DON = [0, 6, 8, 12, 14];           // big taiko hits (16-step bar)
const KA = [4, 10, 15];                  // rim clicks
const MELODY = [                          // [step, note, length in steps] over 32 steps
  [0, 'E5', 3], [3, 'D5', 1], [4, 'C5', 2], [6, 'A4', 2], [8, 'C5', 3], [11, 'D5', 1], [12, 'E5', 4],
  [16, 'G5', 3], [19, 'E5', 1], [20, 'D5', 2], [22, 'C5', 2], [24, 'D5', 3], [27, 'C5', 1], [28, 'A4', 4],
];

const Sound = {
  ctx: null, muted: save.muted,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.comp = c.createDynamicsCompressor();
    this.comp.connect(c.destination);
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.9; this.master.connect(this.comp);
    this.sfx = c.createGain(); this.sfx.gain.value = 0.9; this.sfx.connect(this.master);
    this.music = c.createGain(); this.music.gain.value = 0.28; this.music.connect(this.master);
    // simple echo for the flute
    this.echo = c.createDelay(1); this.echo.delayTime.value = MUSIC_STEP;
    const fb = c.createGain(); fb.gain.value = 0.3;
    const wet = c.createGain(); wet.gain.value = 0.45;
    this.echo.connect(fb); fb.connect(this.echo); this.echo.connect(wet); wet.connect(this.music);
    // white noise buffer
    const buf = c.createBuffer(1, c.sampleRate, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.nextTime = c.currentTime + 0.1; this.stepI = 0;
    setInterval(() => this.schedule(), 25);
    this.mood = 'battle';
    if (this.moodWanted && this.moodWanted !== 'battle') this.setMood(this.moodWanted);
    if (this.fireWanted) this.setFire(true);
  },
  // 'battle' = taiko + flute; 'story' = slow sad flute + soft drone
  setMood(m) {
    this.moodWanted = m;
    if (!this.ctx || this.mood === m) return;
    this.mood = m;
    const c = this.ctx, t = c.currentTime;
    if (m === 'story' && !this.drone) {
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 2);
      g.connect(this.music);
      const oscs = [110, 164.81, 220.5].map(f => { const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(g); o.start(t); return o; });
      this.drone = { g, oscs };
    } else if (m !== 'story' && this.drone) {
      const d = this.drone;
      d.g.gain.setTargetAtTime(0.0001, t, 0.4);
      d.oscs.forEach(o => o.stop(t + 2.5));
      this.drone = null;
    }
  },
  // crackling fire bed (low rumble loop + random pops in schedule())
  setFire(on) {
    this.fireWanted = on;
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    if (on && !this.fire) {
      const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = this.noiseBuf; src.loop = true;
      f.type = 'lowpass'; f.frequency.value = 450;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.8);
      src.connect(f); f.connect(g); g.connect(this.sfx); src.start(t);
      this.fire = { src, g };
    } else if (!on && this.fire) {
      const fr = this.fire;
      fr.g.gain.setTargetAtTime(0.0001, t, 0.2);
      fr.src.stop(t + 1.2);
      this.fire = null;
    }
  },
  setMuted(m) {
    this.muted = m; save.muted = m; writeSave();
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.03);
  },
  get ok() { return !!this.ctx && !this.muted; },
  env(g, t, attack, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  },
  tone(type, f0, t, dur, o = {}) {
    const c = this.ctx, osc = c.createOscillator(), g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    this.env(g, t, o.attack || 0.005, o.gain || 0.3, dur);
    osc.connect(g); g.connect(o.dest || this.sfx);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  noise(t, dur, o = {}) {
    const c = this.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf;
    f.type = o.filter || 'lowpass';
    f.frequency.setValueAtTime(o.freq || 1000, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    f.Q.value = o.Q || 0.8;
    this.env(g, t, o.attack || 0.003, o.gain || 0.3, dur);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfx);
    src.start(t, Math.random() * 0.4); src.stop(t + dur + 0.05);
  },
  // ---- sound effects ----
  whoosh(p = 1) {
    if (!this.ok) return;
    const t = this.ctx.currentTime, dur = 0.12 + 0.08 * p;
    this.noise(t, dur, { filter: 'bandpass', freq: 380, to: 1500 + 700 * p, Q: 1.4, gain: 0.16 * p, attack: dur * 0.45 });
  },
  thud() {
    if (!this.ok) return;
    const t = this.ctx.currentTime;
    this.tone('sine', 170, t, 0.14, { to: 50, gain: 0.7 });
    this.noise(t, 0.07, { filter: 'lowpass', freq: 1400, gain: 0.45 });
  },
  heavy() {
    if (!this.ok) return;
    const t = this.ctx.currentTime;
    this.tone('sine', 125, t, 0.32, { to: 34, gain: 0.95 });
    this.tone('triangle', 240, t, 0.12, { to: 60, gain: 0.3 });
    this.noise(t, 0.16, { filter: 'lowpass', freq: 1000, to: 200, gain: 0.7 });
  },
  clink() {
    if (!this.ok) return;
    const t = this.ctx.currentTime;
    [1250, 1890, 2730, 3610].forEach((f, i) => this.tone('triangle', f, t, 0.32 - i * 0.05, { gain: 0.09 }));
    this.noise(t, 0.03, { filter: 'highpass', freq: 3000, gain: 0.3 });
  },
  ding() {
    if (!this.ok) return;
    const t = this.ctx.currentTime;
    this.tone('sine', 1568, t, 0.9, { gain: 0.3 });
    this.tone('sine', 2349, t, 0.7, { gain: 0.16 });
    this.tone('sine', 3136, t, 0.45, { gain: 0.08 });
  },
  boom() {
    if (!this.ok) return;
    const t = this.ctx.currentTime;
    this.tone('sine', 90, t, 1.4, { to: 26, gain: 1 });
    this.tone('sawtooth', 55, t, 0.6, { to: 28, gain: 0.12 });
    this.noise(t, 1.0, { filter: 'lowpass', freq: 500, to: 70, gain: 0.7, attack: 0.01 });
  },
  gong() {
    if (!this.ok) return;
    const t = this.ctx.currentTime;
    [1, 1.52, 2.03, 2.74, 3.33, 4.2].forEach((r, i) => this.tone('sine', 98 * r, t, 3 - i * 0.35, { gain: 0.32 / (i + 1) }));
    this.noise(t, 0.1, { filter: 'bandpass', freq: 600, gain: 0.3 });
  },
  blip() { if (this.ok) this.tone('triangle', 660, this.ctx.currentTime, 0.07, { gain: 0.12 }); },
  drum() {                                    // distant war drum (intro)
    if (!this.ok) return;
    const t = this.ctx.currentTime;
    this.tone('sine', 78, t, 0.65, { to: 38, gain: 0.75 });
    this.noise(t, 0.12, { filter: 'lowpass', freq: 240, gain: 0.4 });
  },
  setMusicLevel(v, tc = 0.5) {                // 0 = silence (story moments), 1 = normal
    this.musicLevel = v;
    if (this.music) this.music.gain.setTargetAtTime(0.28 * v, this.ctx.currentTime, tc);
  },
  select() { if (this.ok) this.tone('triangle', 880, this.ctx.currentTime, 0.14, { to: 1320, gain: 0.16 }); },
  // ---- music ----
  schedule() {
    const c = this.ctx;
    if (!c || c.state !== 'running') return;
    if (this.nextTime < c.currentTime - 0.1) this.nextTime = c.currentTime + 0.05;
    if (this.fire && !this.muted && Math.random() < 0.3)        // fire crackle pops
      this.noise(c.currentTime + Math.random() * 0.03, 0.02 + Math.random() * 0.03,
        { filter: 'bandpass', freq: 1500 + Math.random() * 3000, Q: 3, gain: 0.04 + Math.random() * 0.08, attack: 0.002 });
    while (this.nextTime < c.currentTime + 0.2) {
      if (!this.muted) this.musicStep(this.stepI, this.nextTime);
      this.nextTime += MUSIC_STEP;
      this.stepI = (this.stepI + 1) % 32;
    }
  },
  musicStep(i, t) {
    if (this.mood === 'story') {
      const n = STORY_MELODY.find(m => m[0] === i);
      if (n) this.flute(NOTE[n[1]], t, n[2] * MUSIC_STEP, 0.065);
      return;
    }
    const s = i % 16;
    if (DON.includes(s)) {
      const soft = s === 14;
      this.tone('sine', 100, t, 0.42, { to: 44, gain: soft ? 0.35 : 0.6, dest: this.music });
      this.noise(t, 0.08, { filter: 'lowpass', freq: 300, gain: soft ? 0.18 : 0.32, dest: this.music });
    }
    if (KA.includes(s)) this.noise(t, 0.035, { filter: 'highpass', freq: 2600, gain: 0.12, dest: this.music });
    const n = MELODY.find(m => m[0] === i);
    if (n) this.flute(NOTE[n[1]], t, n[2] * MUSIC_STEP);
  },
  flute(f, t, dur, vol = 0.09) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
    o.type = 'sine'; o.frequency.value = f;
    lfo.frequency.value = 5.2;
    lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.012, t + 0.25);
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.08);
    g.gain.setValueAtTime(vol, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.15);
    o.connect(g); g.connect(this.music); g.connect(this.echo);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.2); lfo.stop(t + dur + 0.2);
    this.noise(t, 0.12, { filter: 'bandpass', freq: f * 2, Q: 2, gain: 0.02, attack: 0.04, dest: this.music });
  },
};

function toggleMute() { Sound.init(); Sound.setMuted(!Sound.muted); }

/* =========================================================================
   5. CANVAS SETUP / RESIZE (scaled to fit, keeps 16:9)
   ========================================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const bgCanvases = [0, 1, 2, 3, 4, 5].map(() => document.createElement('canvas'));
let scale = 1;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / W, innerHeight / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.max(1, Math.floor(cw * dpr));
  canvas.height = Math.max(1, Math.floor(ch * dpr));
  scale = canvas.width / W;
  bgCanvases.forEach((bc, i) => {       // each stage background is pre-rendered once per resize
    bc.width = canvas.width; bc.height = canvas.height;
    drawBackground(bc.getContext('2d'), scale, i);
  });
  IMG.bg.concat(IMG.intro).forEach(prerenderImg);   // image backgrounds follow the window size too
}
addEventListener('resize', resize);

/* =========================================================================
   5b. IMAGE BACKGROUNDS (assets/bg1-3.jpg, assets/intro1-5.jpg)
   Plain <img> loading works from file:// (double-click). Each loaded image is
   pre-rendered once per window size: "cover" fit + darkening + vignette.
   If an image is missing / fails, the canvas-drawn background is used instead.
   ========================================================================= */
const IMG = { bg: [], intro: [] };
function loadImg(list, i, src) {
  const o = { ok: false, img: new Image(), cv: null, rect: null };
  list[i] = o;
  o.img.onload = () => { o.ok = true; prerenderImg(o); };
  o.img.onerror = () => { o.ok = false; };            // -> canvas fallback
  o.img.src = src;
}
[1, 2, 3].forEach((n, i) => { loadImg(IMG.bg, i, `assets/bg${n}.jpg`); IMG.bg[i].fxIdx = i; });
[1, 2, 3, 4, 5].forEach((n, i) => loadImg(IMG.intro, i, `assets/intro${n}.jpg`));

function prerenderImg(o) {
  if (!o || !o.ok || canvas.width < 2) return;
  const iw = o.img.naturalWidth, ih = o.img.naturalHeight;
  if (!iw || !ih) return;
  const cv = o.cv || document.createElement('canvas');
  cv.width = canvas.width; cv.height = canvas.height;
  const c = cv.getContext('2d');
  const s = Math.max(cv.width / iw, cv.height / ih);           // cover: fill + crop overflow
  const dw = iw * s, dh = ih * s;
  const ls = Math.max(W / iw, H / ih);                         // image rect in logical units (for effects)
  // optional ground alignment: move the image up so its floor line (groundY of image height) sits on GROUND
  const fxc = o.fxIdx != null && typeof BG_FX !== 'undefined' ? BG_FX[o.fxIdx] : null;
  const shift = fxc && fxc.groundY ? Math.max(0, (H - ih * ls) / 2 + fxc.groundY * ih * ls - GROUND) : 0;
  const shiftPx = shift * cv.height / H;
  c.drawImage(o.img, (cv.width - dw) / 2, (cv.height - dh) / 2 - shiftPx, dw, dh);
  if (shiftPx > 0) {                                           // fill the strip below with dark stone
    const gb = c.createLinearGradient(0, cv.height - shiftPx - 4, 0, cv.height);
    gb.addColorStop(0, 'rgba(14,10,16,0.6)'); gb.addColorStop(1, '#07050a');
    c.fillStyle = gb; c.fillRect(0, cv.height - shiftPx - 4, cv.width, shiftPx + 4);
  }
  c.fillStyle = 'rgba(4,4,16,0.3)';                            // darken so silhouettes read
  c.fillRect(0, 0, cv.width, cv.height);
  const vg = c.createRadialGradient(cv.width / 2, cv.height * 0.55, cv.height * 0.3, cv.width / 2, cv.height * 0.55, cv.height);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  c.fillStyle = vg; c.fillRect(0, 0, cv.width, cv.height);
  o.cv = cv;
  o.rect = { x: (W - iw * ls) / 2, y: (H - ih * ls) / 2 - shift, w: iw * ls, h: ih * ls };
}
const stageImg = opp => { const o = IMG.bg[opp.img]; return o && o.ok && o.cv ? o : null; };
const introImg = i => { const o = IMG.intro[i]; return i != null && o && o.ok && o.cv ? o : null; };

// Effects tuned to each image (normalized image coords): braziers, glowing windows, fog band, waterfall spray
const BG_FX = [
  { // bg1: moonlit palace + Shiva statue
    torches: [[0.074, 0.555], [0.922, 0.555]],
    lamps: [[0.66, 0.31], [0.72, 0.26], [0.79, 0.3], [0.29, 0.64], [0.76, 0.65], [0.36, 0.65]],
    fog: { y: 0.6, h: 0.16, a: 0.28 }, mist: [[0.63, 0.56], [0.81, 0.5]], fall: 'petals',
  },
  { // bg2: jungle temple ruins + waterfall
    torches: [[0.072, 0.565], [0.927, 0.565]],
    lamps: [],
    fog: { y: 0.58, h: 0.2, a: 0.36 }, mist: [[0.535, 0.5], [0.24, 0.66]], fall: 'embers',
  },
  { // bg3: stone steps, giant statue in the sky, braziers left/right, waterfalls
    groundY: 0.9,                                          // fighters stand on the stone landing
    torches: [[0.085, 0.585], [0.86, 0.665]],
    lamps: [[0.08, 0.42], [0.12, 0.44], [0.17, 0.46], [0.31, 0.74], [0.53, 0.89]],
    fog: { y: 0.66, h: 0.16, a: 0.3 }, mist: [[0.59, 0.62], [0.73, 0.7]], fall: 'petals',
  },
];

// soft fog sprite (made once), tiled and scrolled
const fogSprite = (() => {
  const c = document.createElement('canvas'); c.width = 640; c.height = 240;
  const g = c.getContext('2d');
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * 640, y = 95 + Math.random() * 50, r = 40 + Math.random() * 50;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(190,200,235,0.5)'); rg.addColorStop(1, 'rgba(190,200,235,0)');
    g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
    if (x < r) { g.save(); g.translate(640, 0); g.fillRect(x - r, y - r, r * 2, r * 2); g.restore(); }   // seamless wrap
    if (x > 640 - r) { g.save(); g.translate(-640, 0); g.fillRect(x - r, y - r, r * 2, r * 2); g.restore(); }
  }
  g.globalCompositeOperation = 'destination-in';     // fade top/bottom so the band has no hard edges
  const m = g.createLinearGradient(0, 0, 0, 240);
  m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(0.35, 'rgba(0,0,0,1)');
  m.addColorStop(0.65, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = m; g.fillRect(0, 0, 640, 240);
  return c;
})();

let envFx = [], envT = 0;
function updateEnv(dt, opp) {
  envT += dt;
  const im = opp && stageImg(opp);
  if (!im) { envFx.length = 0; return; }
  const fx = BG_FX[opp.img], r = im.rect, k = dt * 60;
  for (const [nx, ny] of fx.torches) {
    const x = r.x + nx * r.w, y = r.y + ny * r.h;
    if (Math.random() < 0.7 * k) envFx.push({ type: 'flame', x: x + (Math.random() - 0.5) * 16, y: y - 8, vx: (Math.random() - 0.5) * 0.5, vy: -0.9 - Math.random() * 1.3, r: 1.5 + Math.random() * 2.5, life: 0, max: 25 + Math.random() * 30 });
  }
  if (fx.fall === 'petals' && Math.random() < 0.07 * k)
    envFx.push({ type: 'petal', x: Math.random() * W, y: -10, vx: 0.3 + Math.random() * 0.6, vy: 0.5 + Math.random() * 0.6, r: 2.5 + Math.random() * 2, rot: Math.random() * 6, life: 0, max: 1000 });
  if (Math.random() < 0.07 * k)
    envFx.push({ type: 'ember', x: Math.random() * W, y: H * 0.5 + Math.random() * H * 0.45, vx: (Math.random() - 0.3) * 0.4, vy: -0.25 - Math.random() * 0.6, r: 0.8 + Math.random() * 1.6, life: 0, max: 320 });
  for (const [nx, ny] of fx.mist) if (Math.random() < 0.06 * k)
    envFx.push({ type: 'mist', x: r.x + nx * r.w + (Math.random() - 0.5) * 50, y: r.y + ny * r.h + Math.random() * 30, vx: (Math.random() - 0.5) * 0.3, vy: -0.12, r: 18 + Math.random() * 22, life: 0, max: 220 });
  for (const p of envFx) {
    p.life += k; p.x += p.vx * k; p.y += p.vy * k;
    if (p.type === 'petal') { p.rot += 0.03 * k; p.vx += Math.sin(p.life * 0.02) * 0.01 * k; }
    if (p.type === 'mist') p.r += 0.12 * k;
    if (p.type === 'ember') p.vx += Math.sin(p.life * 0.05) * 0.015 * k;
  }
  envFx = envFx.filter(p => p.life < p.max && p.y < H + 20);
  if (envFx.length > 350) envFx.splice(0, envFx.length - 350);
}

// Draws effects in background-image space (caller sets the transform)
function drawEnvFx(opp, im) {
  const fx = BG_FX[opp.img], r = im.rect, t = envT;
  ctx.save();
  if (opp.tint) { ctx.fillStyle = opp.tint; ctx.fillRect(-W, -H, W * 3, H * 3); }   // per-fight color grade
  // drifting fog (two layers, different speeds)
  const fy = r.y + fx.fog.y * r.h, fh = fx.fog.h * r.h;
  for (let l = 0; l < 2; l++) {
    const fw = 900, off = (t * (10 + l * 7)) % fw;
    ctx.globalAlpha = Math.min(0.85, fx.fog.a * (opp.fogMul || 1)) * (l ? 0.6 : 1);
    for (let i = -1; i < 3; i++) ctx.drawImage(fogSprite, i * fw - off * (l ? -1 : 1), fy + l * fh * 0.4 - fh * 0.8, fw, fh * 2.4);
  }
  ctx.globalAlpha = 1;
  for (const p of envFx) {
    const a = (1 - p.life / p.max) * Math.min(1, p.life / 15);
    if (p.type === 'mist') {                     // soft waterfall spray
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, `rgba(200,210,240,${0.09 * a})`); g.addColorStop(1, 'rgba(200,210,240,0)');
      ctx.fillStyle = g; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    }
    else if (p.type === 'petal') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = `rgba(175,18,32,${0.85 * a})`;
      ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  // warm light: flickering braziers and glowing windows
  ctx.globalCompositeOperation = 'lighter';
  fx.torches.forEach(([nx, ny], i) => {
    const x = r.x + nx * r.w, y = r.y + ny * r.h - 12;
    const fl = 0.75 + 0.25 * Math.sin(t * 13 + i * 2) * Math.sin(t * 7.3 + i);
    const g = ctx.createRadialGradient(x, y, 4, x, y, 150);
    g.addColorStop(0, `rgba(255,170,70,${Math.min(0.85, 0.42 * fl * (opp.torchMul || 1))})`); g.addColorStop(1, 'rgba(255,90,30,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 150, y - 150, 300, 300);
  });
  fx.lamps.forEach(([nx, ny], i) => {
    const x = r.x + nx * r.w, y = r.y + ny * r.h;
    const fl = 0.7 + 0.3 * Math.sin(t * 5 + i * 1.7);
    const g = ctx.createRadialGradient(x, y, 1, x, y, 26);
    g.addColorStop(0, `rgba(255,170,80,${0.22 * fl})`); g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 26, y - 26, 52, 52);
  });
  for (const p of envFx) {
    const a = (1 - p.life / p.max);
    if (p.type === 'flame') { ctx.fillStyle = `rgba(255,${150 + (a * 90 | 0)},60,${0.8 * a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.5), 0, Math.PI * 2); ctx.fill(); }
    else if (p.type === 'ember') { ctx.fillStyle = `rgba(255,140,60,${0.7 * a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
}

// Static backdrop for menus/VS: image if available, else the canvas background
function drawStageBackdrop(opp) {
  const im = stageImg(opp);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!im) { ctx.drawImage(bgCanvases[opp.bg], 0, 0); return; }
  ctx.drawImage(im.cv, 0, 0);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawEnvFx(opp, im);
}

// 4/5: story variants of sunset / blood moon without the pagoda + torii (Indian village scenes draw their own)
STAGES.push(Object.assign({}, STAGES[0], { pagoda: -500, torii: -500 }));
STAGES.push(Object.assign({}, STAGES[2], { pagoda: -500, torii: -500 }));

let seed = 1;
function srand(n) { seed = n; }
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function ridge(c, base, amp, step, color, seedN) {
  srand(seedN);
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(-50, H);
  let x = -50;
  c.lineTo(x, base - amp * 0.4);
  while (x <= W + step) {
    const peakX = x + step * (0.4 + rnd() * 0.5);
    c.lineTo(peakX, base - amp * (0.35 + rnd() * 0.65));
    x = peakX + step * (0.3 + rnd() * 0.5);
    c.lineTo(x, base - amp * (0.05 + rnd() * 0.3));
  }
  c.lineTo(W + 50, H);
  c.closePath();
  c.fill();
}

function pagoda(c, x, base, sc, col) {
  c.fillStyle = col;
  const tiers = 5, th = 26 * sc;
  for (let i = 0; i < tiers; i++) {
    const w = (92 - i * 13) * sc, y = base - i * th;
    c.fillRect(x - w * 0.32, y - th, w * 0.64, th);
    c.beginPath();
    c.moveTo(x - w * 0.85, y - th - 4 * sc);
    c.quadraticCurveTo(x - w * 0.55, y - th + 2 * sc, x - w * 0.38, y - th - 12 * sc);
    c.lineTo(x + w * 0.38, y - th - 12 * sc);
    c.quadraticCurveTo(x + w * 0.55, y - th + 2 * sc, x + w * 0.85, y - th - 4 * sc);
    c.lineTo(x + w * 0.6, y - th + 3 * sc);
    c.lineTo(x - w * 0.6, y - th + 3 * sc);
    c.closePath();
    c.fill();
  }
  const top = base - tiers * th - 12 * sc;
  c.fillRect(x - 2 * sc, top - 46 * sc, 4 * sc, 46 * sc);
  for (let i = 0; i < 4; i++) c.fillRect(x - 6 * sc, top - 10 * sc - i * 9 * sc, 12 * sc, 3 * sc);
}

function torii(c, x, base, h, col) {
  c.fillStyle = col;
  const w = h * 1.15, pw = h * 0.075;
  c.fillRect(x - w * 0.36, base - h, pw, h);
  c.fillRect(x + w * 0.36 - pw, base - h, pw, h);
  c.fillRect(x - w * 0.47, base - h * 0.76, w * 0.94, h * 0.065);
  c.fillRect(x - pw / 2, base - h * 0.95, pw, h * 0.2);
  c.beginPath();
  c.moveTo(x - w * 0.62, base - h * 1.06);
  c.quadraticCurveTo(x, base - h * 0.9, x + w * 0.62, base - h * 1.06);
  c.lineTo(x + w * 0.56, base - h * 0.95);
  c.quadraticCurveTo(x, base - h * 0.82, x - w * 0.56, base - h * 0.95);
  c.closePath();
  c.fill();
}

function pine(c, x, base, h, col) {
  c.fillStyle = col;
  c.fillRect(x - 4, base - h * 0.35, 8, h * 0.35);
  for (let i = 0; i < 4; i++) {
    const y = base - h * 0.25 - i * h * 0.19, w = h * 0.36 * (1 - i * 0.2);
    c.beginPath();
    c.moveTo(x - w, y);
    c.lineTo(x, y - h * 0.32);
    c.lineTo(x + w, y);
    c.closePath();
    c.fill();
  }
}

function drawBackground(c, s, v) {
  const st = STAGES[v];
  c.setTransform(s, 0, 0, s, 0, 0);
  // Sky
  const g = c.createLinearGradient(0, 0, 0, GROUND);
  st.sky.forEach(([o, col]) => g.addColorStop(o, col));
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);

  // Stars
  srand(99 + v);
  for (let i = 0; i < st.stars; i++) {
    c.fillStyle = `rgba(255,240,230,${0.2 + rnd() * 0.6})`;
    c.beginPath(); c.arc(rnd() * W, rnd() * H * 0.55, 0.5 + rnd() * 1.3, 0, Math.PI * 2); c.fill();
  }

  // Sun / moon + glow
  const o = st.orb;
  const glow = c.createRadialGradient(o.x, o.y, o.r * 0.8, o.x, o.y, o.r * 2.8);
  glow.addColorStop(0, `rgba(${o.glow},0.55)`);
  glow.addColorStop(1, `rgba(${o.glow},0)`);
  c.fillStyle = glow;
  c.fillRect(0, 0, W, H);
  const sg = c.createRadialGradient(o.x - (o.moon ? 30 : 0), o.y - 50, 20, o.x, o.y, o.r);
  sg.addColorStop(0, o.c0);
  sg.addColorStop(1, o.c1);
  c.fillStyle = sg;
  c.beginPath(); c.arc(o.x, o.y, o.r, 0, Math.PI * 2); c.fill();
  if (o.moon) {
    c.fillStyle = 'rgba(70,0,0,0.25)';
    [[-35, -20, 22], [30, 25, 16], [10, -45, 10], [-20, 40, 12], [45, -10, 9]].forEach(([dx, dy, r]) => {
      c.beginPath(); c.arc(o.x + dx, o.y + dy, r, 0, Math.PI * 2); c.fill();
    });
  }

  // Cloud streaks
  c.fillStyle = st.cloud;
  [[210, 160, 270, 7], [930, 120, 310, 6], [560, 290, 400, 6], [790, 335, 260, 4],
   [330, 250, 210, 4], [1090, 245, 230, 5], [640, 400, 330, 4], [900, 215, 220, 4]].forEach(([x, y, rx, ry]) => {
    c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill();
  });

  // Mountain layers (far -> near)
  ridge(c, 470, 170, 80, st.far, 3 + v);
  ridge(c, 535, 120, 60, st.mid, 11 + v);
  pagoda(c, st.pagoda, 520, 1.05, st.mid);
  ridge(c, 592, 46, 45, st.near, 7 + v);
  torii(c, st.torii, 600, 150, st.deco);
  pine(c, 55, 605, 190, st.trees);
  pine(c, 1215, 605, 210, st.trees);
  pine(c, v === 1 ? 160 : 1120, 605, 140, st.deco);

  // Mist above the floor
  const mist = c.createLinearGradient(0, GROUND - 110, 0, GROUND);
  mist.addColorStop(0, `rgba(${st.mist},0)`);
  mist.addColorStop(1, `rgba(${st.mist},0.22)`);
  c.fillStyle = mist;
  c.fillRect(0, GROUND - 110, W, 110);

  // Ground
  const gg = c.createLinearGradient(0, GROUND, 0, H);
  gg.addColorStop(0, st.ground[0]);
  gg.addColorStop(1, st.ground[1]);
  c.fillStyle = gg;
  c.fillRect(0, GROUND, W, H - GROUND);
  c.fillStyle = st.line;
  c.fillRect(0, GROUND, W, 2);
}
