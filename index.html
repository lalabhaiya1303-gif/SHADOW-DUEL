/* =========================================================================
   15b. STORY — "THE LAST PROMISE": cutscene engine, panels, dialogue boxes
   A cutscene is a list of panels. Each panel: background, camera drift,
   actors (Fighter silhouettes driven by forcePose), particles, typed text.
   ========================================================================= */
let cs = null;                       // active cutscene state
const vsDlg = { i: 0, t: 0 };        // VS-screen dialogue progress

function playCutscene(panels, onDone) {
  scene = 'cutscene'; sceneT = 0; paused = false;
  cs = { panels, i: -1, onDone, done: false, fx: [], actors: {} };
  nextPanel();
  Sound.setMood('story');
}
function nextPanel() {
  cs.i++;
  if (cs.i >= cs.panels.length) { finishCutscene(); return; }
  const p = cs.panels[cs.i];
  cs.t = 0; cs.out = null; cs.fx = [];
  cs.actors = p.setup ? p.setup() : {};
  cs.dur = Math.max(p.dur || 6, p.text ? p.text.length / (p.cps || 28) + 2.6 : 0);
  Sound.setFire(!!p.fire);
}
function advancePanel() { if (cs && !cs.done && cs.out === null && cs.t > 0.3) { cs.out = 0.45; cs.outMax = 0.45; } }
function finishCutscene() {               // safe to call many times (skip spam)
  if (!cs || cs.done) return;
  cs.done = true;
  Sound.setFire(false);
  Sound.setMood('battle');
  cs.onDone();
}
function updateCutscene(dt) {
  if (!cs || cs.done) return;
  const p = cs.panels[cs.i];
  cs.t += dt;
  if (p.update) p.update(cs.actors, cs.t, dt);
  updateCsFx(p, dt);
  if (cs.out !== null) { cs.out -= dt; if (cs.out <= 0) nextPanel(); }
  else if (cs.t >= cs.dur) { cs.out = 0.7; cs.outMax = 0.7; }
}
function csFighters() {
  if (!cs || cs.done) return [];
  const out = [];
  for (const v of Object.values(cs.actors)) {
    if (v instanceof Fighter) out.push(v);
    else if (Array.isArray(v)) v.forEach(f => { if (f instanceof Fighter) out.push(f); });
  }
  return out;
}

// ---- cutscene particles: smoke, rising/falling embers, golden motes ----
function updateCsFx(p, dt) {
  const k = dt * 60, fx = cs.fx;
  if (p.fires) for (const [x, base, w] of p.fires) {
    if (Math.random() < 0.22 * k) fx.push({ type: 'smoke', x: x + (Math.random() - 0.5) * w, y: base - 70 - Math.random() * 40, vx: 0.25 + Math.random() * 0.4, vy: -0.6 - Math.random() * 0.6, r: 14 + Math.random() * 16, life: 0, max: 220 + Math.random() * 100, a: 0.3 });
    if (Math.random() < 0.5 * k) fx.push({ type: 'ember', x: x + (Math.random() - 0.5) * w, y: base - 30 - Math.random() * 60, vx: (Math.random() - 0.3) * 1.2, vy: -1 - Math.random() * 2, r: 1 + Math.random() * 2, life: 0, max: 80 + Math.random() * 80 });
  }
  if (p.smokes) for (const [x, base, w] of p.smokes)
    if (Math.random() < 0.08 * k) fx.push({ type: 'smoke', x: x + (Math.random() - 0.5) * w, y: base - 40, vx: 0.35 + Math.random() * 0.3, vy: -0.35 - Math.random() * 0.3, r: 8 + Math.random() * 10, life: 0, max: 300, a: 0.18 });
  if (p.falling && Math.random() < 0.35 * k) fx.push({ type: 'ember', x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 0.6, vy: 0.5 + Math.random() * 0.8, r: 1 + Math.random() * 2, life: 0, max: 500 });
  if (p.motes && Math.random() < 0.18 * k) fx.push({ type: 'mote', x: Math.random() * W, y: H * 0.35 + Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 0.3, vy: -0.15 - Math.random() * 0.3, r: 1.5 + Math.random() * 2.5, life: 0, max: 300 });
  for (const f of fx) {
    f.life += k; f.x += f.vx * k; f.y += f.vy * k;
    if (f.type === 'smoke') f.r += 0.15 * k;
    else f.vx += Math.sin(f.life * 0.05) * 0.02 * k;
  }
  cs.fx = fx.filter(f => f.life < f.max && f.y < H + 20);
  if (cs.fx.length > 450) cs.fx.splice(0, cs.fx.length - 450);
}
function drawCsFx() {
  ctx.save();
  for (const f of cs.fx) if (f.type === 'smoke') {
    const a = f.a * (1 - f.life / f.max) * Math.min(1, f.life / 25);
    ctx.fillStyle = `rgba(18,8,12,${a})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const f of cs.fx) {
    if (f.type === 'smoke') continue;
    const a = (1 - f.life / f.max) * (f.type === 'mote' ? 0.6 : 0.9);
    ctx.fillStyle = f.type === 'mote' ? `rgba(255,220,150,${a})` : `rgba(255,${120 + (f.r * 30 | 0)},40,${a})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ---- scenery helpers ----
function drawHouse(x, base, w, h, col, broken) {
  ctx.fillStyle = col;
  if (!broken) {
    ctx.fillRect(x - w / 2, base - h, w, h);
    ctx.beginPath();
    ctx.moveTo(x - w * 0.7, base - h + 6);
    ctx.quadraticCurveTo(x - w * 0.45, base - h - 4, x - w * 0.3, base - h - h * 0.45);
    ctx.lineTo(x + w * 0.3, base - h - h * 0.45);
    ctx.quadraticCurveTo(x + w * 0.45, base - h - 4, x + w * 0.7, base - h + 6);
    ctx.closePath(); ctx.fill();
  } else {                                   // ruined: broken walls + fallen beams + rubble
    ctx.fillRect(x - w / 2, base - h * 0.55, w * 0.18, h * 0.55);
    ctx.fillRect(x + w * 0.25, base - h * 0.85, w * 0.15, h * 0.85);
    ctx.save(); ctx.translate(x, base - h * 0.5); ctx.rotate(0.35); ctx.fillRect(-w * 0.55, -6, w * 1.1, 12); ctx.restore();
    ctx.save(); ctx.translate(x - w * 0.1, base - h * 0.25); ctx.rotate(-0.5); ctx.fillRect(-w * 0.4, -5, w * 0.8, 10); ctx.restore();
    ctx.beginPath();
    ctx.moveTo(x - w * 0.6, base); ctx.lineTo(x - w * 0.3, base - 18); ctx.lineTo(x, base - 10);
    ctx.lineTo(x + w * 0.35, base - 22); ctx.lineTo(x + w * 0.6, base); ctx.closePath(); ctx.fill();
  }
}
function drawFire(x, base, w, h, t, seed) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const flick = 0.85 + 0.15 * Math.sin(t * 9 + seed);
  const glow = ctx.createRadialGradient(x, base - h * 0.4, 10, x, base - h * 0.4, w * 1.6);
  glow.addColorStop(0, `rgba(255,140,40,${0.35 * flick})`); glow.addColorStop(1, 'rgba(255,60,20,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(x - w * 1.6, base - h * 0.4 - w * 1.6, w * 3.2, w * 3.2);
  const n = 6;
  for (let i = 0; i < n; i++) {
    const fx = x + (i / (n - 1) - 0.5) * w * 0.9;
    const fh = h * (0.55 + 0.45 * Math.abs(Math.sin(t * 6 + i * 1.9 + seed)));
    const fw = w / n * 1.4;
    const g = ctx.createLinearGradient(0, base, 0, base - fh);
    g.addColorStop(0, 'rgba(255,220,120,0.9)'); g.addColorStop(0.5, 'rgba(255,120,30,0.7)'); g.addColorStop(1, 'rgba(200,30,10,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(fx - fw / 2, base);
    ctx.quadraticCurveTo(fx - fw * 0.6, base - fh * 0.5, fx + Math.sin(t * 5 + i) * fw * 0.4, base - fh);
    ctx.quadraticCurveTo(fx + fw * 0.6, base - fh * 0.5, fx + fw / 2, base);
    ctx.fill();
  }
  ctx.restore();
}
function drawBurning(list, t, broken, col = '#0d0206') {
  list.forEach(([x, base, w, h], i) => {
    drawHouse(x, base, w * 1.1, h * 0.9, col, broken);
    drawFire(x, base - h * 0.25, w, h * 1.1, t, i * 2.3);
  });
}
// draw a Fighter silhouette; opts.at = [screenX, screenY, scale], opts.glow = color
function drawActor(f, opts = {}) {
  ctx.save();
  if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
  if (opts.at) { ctx.translate(opts.at[0], opts.at[1]); ctx.scale(opts.at[2], opts.at[2]); ctx.translate(-f.x, -GROUND); }
  if (!opts.noShadow) drawShadow(f);
  if (opts.glow) { ctx.shadowColor = opts.glow; ctx.shadowBlur = 30; }
  drawFighter(f);
  ctx.restore();
}
function newActor(x, facing, prof, pose, extra = {}) {
  const f = new Fighter(x, facing, '', prof === PLAYER_PROFILE || prof === KAITO_WIND, prof);
  f.forcePose = pose; f.pose = POSES[pose].slice(); f.computeSkeleton();
  return Object.assign(f, extra);
}

// ---- text helpers ----
function wrapLines(str, maxW, font) {
  ctx.font = font;
  const lines = []; let line = '';
  for (const w of str.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
// centered, typed-out text (line breaks computed on the FULL text so it never reflows)
function drawTyped(full, chars, cx, y, maxW, lh, font, color, align = 'center') {
  const lines = wrapLines(full, maxW, font);
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'middle';
  let left = Math.max(0, Math.floor(chars));
  const y0 = align === 'center' ? y - (lines.length - 1) * lh / 2 : y;
  lines.forEach((ln, i) => {
    if (left <= 0) return;
    const part = ln.slice(0, left);
    left -= ln.length + 1;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineJoin = 'round';
    ctx.strokeText(part, cx, y0 + i * lh);
    ctx.fillStyle = color;
    ctx.fillText(part, cx, y0 + i * lh);
  });
  return Math.floor(chars) >= full.length;
}
// Speech box used on VS screens and for defeat lines
function drawSpeech(name, line, cx, y, w, who, chars, tailX) {
  const h = 104, x = cx - w / 2, col = who === 'kaito' ? '#f4e6c8' : '#ff6a4a';
  ctx.save();
  ctx.fillStyle = 'rgba(6,2,6,0.85)';
  ctx.fillRect(x, y, w, h);
  if (tailX != null) {
    ctx.beginPath(); ctx.moveTo(tailX - 14, y + h); ctx.lineTo(tailX + 14, y + h); ctx.lineTo(tailX, y + h + 22); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  text(name, x + 16, y + 18, 22, col, 'left', BRUSH);
  const done = drawTyped(line, chars, x + 18, y + 52, w - 36, 28, 'italic 23px Georgia, serif', '#f4ece0', 'left');
  if (done) text('▶', x + w - 18, y + h - 16, 16, `rgba(255,240,220,${0.5 + 0.5 * Math.sin(performance.now() / 180)})`, 'right');
  ctx.restore();
  return done;
}

function renderCutscene() {
  if (!cs || cs.done) return;
  const p = cs.panels[cs.i], t = cs.t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // camera drift (eased over the panel)
  const c = p.cam || [0, 0, 1, 1, W / 2, H / 2];
  const k = Math.min(1, t / cs.dur), e = k * k * (3 - 2 * k);
  const dx = c[0] + (c[1] - c[0]) * e, z = c[2] + (c[3] - c[2]) * e, fx = c[4], fy = c[5];
  if (p.filter) ctx.filter = p.filter;
  // background layer: slower parallax
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const bz = 1.04 + (z - 1) * 0.4;
  ctx.translate(fx, fy); ctx.scale(bz, bz); ctx.translate(-fx + dx * 0.3, -fy);
  ctx.drawImage(bgCanvases[p.bg], 0, 0, W, H);
  // world layer
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (p.tint) { ctx.fillStyle = p.tint; ctx.fillRect(0, 0, W, H); }
  ctx.translate(fx, fy); ctx.scale(z, z); ctx.translate(-fx + dx, -fy);
  if (p.draw) p.draw.call(p, cs.actors, t);
  drawCsFx();
  ctx.filter = 'none';
  // screen-space overlays
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (p.dim) { ctx.fillStyle = `rgba(0,0,0,${p.dim})`; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (p.overlay) p.overlay(t);
  // cinematic letterbox
  const bar = Math.min(1, sceneT * 2);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, 62 * bar);
  ctx.fillRect(0, H - 118 * bar, W, 118 * bar);
  if (p.text) drawTyped(p.text, (t - 0.5) * (p.cps || 28), W / 2, H - 60, 1180, 34, 'italic 29px Georgia, serif', '#f2e6d8');
  // fades between panels
  const fadeIn = Math.min(1, t / 0.7);
  const fadeOut = cs.out !== null ? Math.max(0, cs.out / cs.outMax) : 1;
  const alpha = fadeIn * fadeOut;
  if (alpha < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - alpha})`; ctx.fillRect(0, 0, W, H); }
  text('ENTER / ESC  skip    ·    SPACE / CLICK  next', W - 20, 32, 14, 'rgba(255,255,255,0.45)', 'right');
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (scene === 'battle') renderBattle();
  else if (scene === 'cutscene') renderCutscene();
  else if (scene === 'menu') renderMenu();
  else if (scene === 'controls') renderControls();
  else if (scene === 'vs') renderVS();
  else if (scene === 'victory') renderVictory();
  drawMuteIcon();
}

/* =========================================================================
   16. MAIN LOOP
   ========================================================================= */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  let n = 0;
  if (scene === 'battle') {
    if (!paused) {
      story.time += dt;
      realUpdate(dt);
      acc += dt * game.timeScale;
      while (acc >= STEP && n++ < 5) { step(); acc -= STEP; }
    }
  } else {
    sceneT += dt;
    acc += dt;
    while (acc >= STEP && n++ < 5) { sceneStep(); acc -= STEP; }
    if (scene === 'cutscene') updateCutscene(dt);
    if (scene === 'vs' && sceneT > 0.8) vsDlg.t += dt;
  }
  if (n >= 5) acc = 0;
  render();
  requestAnimationFrame(frame);
}

if (document.fonts && document.fonts.load) document.fonts.load('40px "Permanent Marker"').catch(() => {});
initEmbers();
goMenu();
resize();
requestAnimationFrame(frame);
</script>
